apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-practice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: git-practice
  template:
    metadata:
      labels:
        app: git-practice
    spec:
      containers:
        - name: git-practice
          image: sk1432/git-practice:REPLACE_TAG
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
