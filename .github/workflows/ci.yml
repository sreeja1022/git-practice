name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run test
        run: |
          output=$(python app.py)
          echo "Output was: $output"
          if [ "$output" != "Hello from CI/CD!" ]; then
            echo "Test failed: unexpected output"
            exit 1
          fi
          echo "Test passed!"

      - name: Build Docker image
        run: docker build -t git-practice-app .
