name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Static code analysis with Ruff
        run: ruff check .

      - name: Run test
        run: |
          output=$(python app.py)
          echo "Output was: $output"
          if [ "$output" != "Hello from CI/CD!" ]; then
            echo "Test failed: unexpected output"
            exit 1
          fi
          echo "Test passed!"

      - name: Check secret
        run: |
          if [ -z "${{ secrets.TEST_SECRET }}" ]; then
            echo "Secret is missing"
            exit 1
          fi
          echo "Secret is available"

      - name: Build Docker image
        run: docker build -t git-practice-app .
