name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Static code analysis with Ruff
        run: ruff check .

      - name: Run test
        run: |
          output=$(python app.py)
          echo "Output was: $output" | tee test-report.txt
          if [ "$output" != "Hello from CI/CD!" ]; then
            echo "Test failed: unexpected output" | tee -a test-report.txt
            exit 1
          fi
          echo "Test passed!" | tee -a test-report.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ github.run_id }}
          path: test-report.txt
      - name: Check secret
        run: |
          if [ -z "${{ secrets.TEST_SECRET }}" ]; then
            echo "Secret is missing"
            exit 1
          fi
          echo "Secret is available"

      - name: Build Docker image
        run: docker build -t git-practice-app .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'git-practice-app:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Save scanned Docker image
        run: docker save git-practice-app:latest -o git-practice-app.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ github.run_id }}
          path: git-practice-app.tar

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for both registries
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag git-practice-app:latest ${{ secrets.DOCKERHUB_USERNAME }}/git-practice:${{ github.sha }}
          docker tag git-practice-app:latest ghcr.io/${{ github.repository_owner }}/git-practice:${{ github.sha }}

      - name: Push image to both registries
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/git-practice:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/git-practice:${{ github.sha }}

  storage-sync:
    name: Sync Build to Mounted Storage
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Linux, X64, storage]

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image-${{ github.run_id }}
          path: /tmp/docker-artifact-${{ github.run_id }}

      - name: Sync build to mounted storage
        run: |
          target="/mnt/ci-storage/${{ github.sha }}"
          test -w /mnt/ci-storage || { echo "Mounted storage is not writable"; exit 1; }
          mkdir -p "$target"
          source_sum=$(sha256sum /tmp/docker-artifact-${{ github.run_id }}/git-practice-app.tar | awk '{print $1}')
          cp /tmp/docker-artifact-${{ github.run_id }}/git-practice-app.tar "$target/"
          target_sum=$(sha256sum "$target/git-practice-app.tar" | awk '{print $1}')
          test "$source_sum" = "$target_sum"
          echo "Checksum verified: $target_sum"
          echo "${{ github.sha }}" > "$target/commit-sha.txt"
          ls -lh "$target"

      - name: Clean temporary artifact files
        if: always()
        run: rm -rf /tmp/docker-artifact-${{ github.run_id }}

  codeql-analysis:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
