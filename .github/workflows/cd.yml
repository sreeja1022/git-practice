name: CD

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t git-practice-app .

      - name: Run Docker container
        run: docker run -d --name git-practice-container git-practice-app

      - name: Test application
        run: docker exec git-practice-container python app.py

      - name: Stop Docker container
        run: docker stop git-practice-container
