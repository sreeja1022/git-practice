name: CD

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t git-practice-app .

      - name: Test application
        run: |
          output=$(docker run --rm git-practice-app)
          echo "Output was: $output"
          if [ "$output" != "Hello from CI/CD!" ]; then
            echo "Application test failed"
            exit 1
          fi
          echo "Application test passed!"
